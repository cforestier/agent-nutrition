name: Notification tick

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call tick endpoint
        run: |
          curl -sf -X GET "${{ secrets.TICK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
