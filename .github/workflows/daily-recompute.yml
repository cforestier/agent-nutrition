name: Daily recompute

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-recompute endpoint
        run: |
          curl -sf -X GET "${{ secrets.RECOMPUTE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
